name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate ports
        run: make build

      - name: Ports are up to date with palette.json
        run: |
          git diff --exit-code -- ports palette || {
            echo "::error::Generated files changed. Run 'make build' and commit the result."; exit 1; }

      - name: Validate
        run: make check

      - name: Package
        run: make dist

      - uses: actions/upload-artifact@v4
        with:
          name: highland
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
